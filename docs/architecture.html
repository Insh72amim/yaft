:root[data-theme=&quot;dark&quot;] {

* {

}

html &gt; body {
  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);

  font-weight: var(--viz-font-weight-medium);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {

}

.table.table-sm :is(th, td):not(:last-child) {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);

  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn {

  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;

  margin: 0;

  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;

}

.btn:not(:disabled):hover {

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

  stroke-width: 1.6;

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;yaft-architecture&quot;&gt;
  &lt;style&gt;
    #yaft-architecture {
      display: grid;
      gap: 18px;
      color: var(--foreground);
    }

    #yaft-architecture * {
      box-sizing: border-box;
    }

    #yaft-architecture .snapshot {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    #yaft-architecture .snapshot .card {
      min-height: 92px;
    }

    #yaft-architecture .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    #yaft-architecture .view {
      display: grid;
      gap: 22px;
    }

    #yaft-architecture .view[hidden] {
      display: none;
    }

    #yaft-architecture .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    #yaft-architecture .section-heading h2,
    #yaft-architecture .section-heading h3,
    #yaft-architecture .section-heading p {
      margin: 0;
    }

    #yaft-architecture .section-heading p {
      text-align: right;
      color: var(--muted-foreground);
    }

    #yaft-architecture .system-flow,
    #yaft-architecture .deploy-flow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 42px minmax(0, 1.25fr) 42px minmax(0, 1.35fr) 42px minmax(0, 1fr);
      align-items: stretch;
      gap: 6px;
    }

    #yaft-architecture .arch-node {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: color-mix(in srgb, var(--viz-series-1) 9%, transparent);
    }

    #yaft-architecture .arch-node.web {
      background: color-mix(in srgb, var(--viz-series-2) 9%, transparent);
    }

    #yaft-architecture .arch-node.api {
      background: color-mix(in srgb, var(--viz-series-3) 9%, transparent);
    }

    #yaft-architecture .arch-node.data {
      background: color-mix(in srgb, var(--viz-series-4) 9%, transparent);
    }

    #yaft-architecture .node-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 500;
    }

    #yaft-architecture .node-copy {
      display: grid;
      gap: 4px;
      color: var(--muted-foreground);
    }

    #yaft-architecture .node-copy strong {
      color: var(--foreground);
      font-weight: 500;
    }

    #yaft-architecture .connector {
      display: grid;
      place-items: center;
      color: var(--muted-foreground);
    }

    #yaft-architecture .connector span {
      display: block;
      width: 100%;
      height: 1px;
      background: var(--border);
      position: relative;
    }

    #yaft-architecture .connector span::after {
      content: &quot;&quot;;
      position: absolute;
      right: -1px;
      top: -4px;
      width: 8px;
      height: 8px;
      border-top: 1px solid var(--muted-foreground);
      border-right: 1px solid var(--muted-foreground);
      transform: rotate(45deg);
    }

    #yaft-architecture .module-grid,
    #yaft-architecture .trust-grid,
    #yaft-architecture .repo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    #yaft-architecture .module,
    #yaft-architecture .trust-item,
    #yaft-architecture .repo-item {
      min-width: 0;
      padding: 10px 0;
      border-top: 2px solid var(--border);
    }

    #yaft-architecture .module strong,
    #yaft-architecture .trust-item strong,
    #yaft-architecture .repo-item strong {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      font-weight: 500;
    }

    #yaft-architecture .module span,
    #yaft-architecture .trust-item span,
    #yaft-architecture .repo-item span {
      display: block;
      color: var(--muted-foreground);
    }

    #yaft-architecture .module code,
    #yaft-architecture .repo-item code {
      overflow-wrap: anywhere;
    }

    #yaft-architecture .flow-track {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      position: relative;
    }

    #yaft-architecture .flow-track::before {
      content: &quot;&quot;;
      position: absolute;
      left: 6%;
      right: 6%;
      top: 15px;
      height: 1px;
      background: var(--border);
      z-index: 0;
    }

    #yaft-architecture .flow-step {
      display: grid;
      justify-items: center;
      gap: 7px;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--muted-foreground);
      cursor: pointer;
      font: inherit;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    #yaft-architecture .flow-step span:first-child {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid var(--input);
      border-radius: var(--radius-full);
      color: var(--secondary-foreground);
      background: var(--secondary);
      font-weight: 500;
    }

    #yaft-architecture .flow-step[aria-pressed=&quot;true&quot;] {
      color: var(--foreground);
    }

    #yaft-architecture .flow-step[aria-pressed=&quot;true&quot;] span:first-child {
      border-color: transparent;
      color: var(--primary-foreground);
      background: var(--primary);
    }

    #yaft-architecture .flow-detail {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: 12px;
    }

    #yaft-architecture .flow-detail .detail-index {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      color: var(--primary-foreground);
      background: var(--primary);
      font-weight: 500;
    }

    #yaft-architecture .flow-detail h3,
    #yaft-architecture .flow-detail p {
      margin: 0;
    }

    #yaft-architecture .flow-detail p {
      margin-top: 4px;
      color: var(--muted-foreground);
    }

    #yaft-architecture .detail-tags {
      margin-top: 9px;
    }

    #yaft-architecture .salary-lane {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
      align-items: stretch;
    }

    #yaft-architecture .salary-lane div {
      min-width: 0;
      padding: 9px;
      border-top: 2px solid var(--viz-series-2);
      background: color-mix(in srgb, var(--viz-series-2) 7%, transparent);
    }

    #yaft-architecture .salary-lane strong,
    #yaft-architecture .salary-lane span {
      display: block;
    }

    #yaft-architecture .salary-lane strong {
      font-weight: 500;
    }

    #yaft-architecture .salary-lane span {
      margin-top: 4px;
      color: var(--muted-foreground);
    }

    #yaft-architecture .model-map {
      display: grid;
      gap: 12px;
    }

    #yaft-architecture .owner-node {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: var(--radius-lg);
      color: var(--primary-foreground);
      background: var(--primary);
    }

    #yaft-architecture .owner-node strong {
      font-weight: 500;
    }

    #yaft-architecture .owner-node span:last-child {
      text-align: right;
    }

    #yaft-architecture .model-domains {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    #yaft-architecture .domain {
      min-width: 0;
      padding-top: 9px;
      border-top: 3px solid var(--viz-series-1);
    }

    #yaft-architecture .domain:nth-child(2) {
      border-color: var(--viz-series-2);
    }

    #yaft-architecture .domain:nth-child(3) {
      border-color: var(--viz-series-3);
    }

    #yaft-architecture .domain:nth-child(4) {
      border-color: var(--viz-series-4);
    }

    #yaft-architecture .domain h3 {
      margin: 0 0 7px;
    }

    #yaft-architecture .entity-list {
      display: grid;
      gap: 5px;
    }

    #yaft-architecture .entity {
      min-width: 0;
      padding: 8px;
      border-radius: var(--radius-sm);
      background: color-mix(in srgb, var(--muted) 65%, transparent);
    }

    #yaft-architecture .entity strong,
    #yaft-architecture .entity span {
      display: block;
    }

    #yaft-architecture .entity strong {
      font-weight: 500;
    }

    #yaft-architecture .entity span {
      margin-top: 3px;
      color: var(--muted-foreground);
    }

    #yaft-architecture .invariant-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 16px;
    }

    #yaft-architecture .invariant {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: start;
      gap: 7px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }

    #yaft-architecture .invariant strong,
    #yaft-architecture .invariant span {
      display: block;
    }

    #yaft-architecture .invariant strong {
      font-weight: 500;
    }

    #yaft-architecture .invariant span {
      color: var(--muted-foreground);
    }

    #yaft-architecture .trust-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #yaft-architecture .trust-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
    }

    #yaft-architecture .trust-item &gt; i {
      color: var(--foreground);
    }

    #yaft-architecture .trust-item ul {
      margin: 6px 0 0;
      padding-left: 18px;
      color: var(--muted-foreground);
    }

    #yaft-architecture .trust-item li + li {
      margin-top: 3px;
    }

    #yaft-architecture .boundary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 11px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    #yaft-architecture .boundary strong,
    #yaft-architecture .boundary span {
      display: block;
    }

    #yaft-architecture .boundary strong {
      font-weight: 500;
    }

    #yaft-architecture .boundary span {
      margin-top: 3px;
      color: var(--muted-foreground);
    }

    #yaft-architecture .deferred {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-top: 9px;
      border-top: 1px dashed var(--border);
      color: var(--muted-foreground);
    }

    #yaft-architecture .table code {
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      #yaft-architecture .snapshot,
      #yaft-architecture .module-grid,
      #yaft-architecture .repo-grid,
      #yaft-architecture .trust-grid,
      #yaft-architecture .invariant-list {
        grid-template-columns: 1fr;
      }

      #yaft-architecture .system-flow,
      #yaft-architecture .deploy-flow {
        grid-template-columns: 1fr;
      }

      #yaft-architecture .connector {
        min-height: 24px;
      }

      #yaft-architecture .connector span {
        width: 1px;
        height: 24px;
      }

      #yaft-architecture .connector span::after {
        right: -4px;
        top: auto;
        bottom: -1px;
        transform: rotate(135deg);
      }

      #yaft-architecture .model-domains {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #yaft-architecture .salary-lane {
        grid-template-columns: 1fr;
      }

      #yaft-architecture .flow-track {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      #yaft-architecture .flow-track::before {
        display: none;
      }

      #yaft-architecture .section-heading {
        align-items: start;
        flex-direction: column;
      }

      #yaft-architecture .section-heading p {
        text-align: left;
      }
    }

    @media (max-width: 410px) {
      #yaft-architecture .model-domains,
      #yaft-architecture .flow-track {
        grid-template-columns: 1fr;
      }

      #yaft-architecture .flow-step {
        grid-template-columns: auto minmax(0, 1fr);
        justify-items: start;
        align-items: center;
        text-align: left;
      }

      #yaft-architecture .owner-node {
        grid-template-columns: auto minmax(0, 1fr);
      }

      #yaft-architecture .owner-node span:last-child {
        grid-column: 1 / -1;
        text-align: left;
      }

      #yaft-architecture .boundary {
        grid-template-columns: 1fr;
      }
    }
  &lt;/style&gt;

      &lt;div class=&quot;section-heading&quot;&gt;
        &lt;h2 id=&quot;trust-heading&quot;&gt;Trust boundaries&lt;/h2&gt;
        &lt;p class=&quot;text-small&quot;&gt;Private records remain within the owner-controlled deployment&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;trust-grid&quot;&gt;
        &lt;div class=&quot;trust-item&quot;&gt;&lt;i data-lucide=&quot;cookie&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Session boundary&lt;/strong&gt;&lt;ul class=&quot;text-small&quot;&gt;&lt;li&gt;Argon2id password hashes&lt;/li&gt;&lt;li&gt;HTTP-only · SameSite Strict · seven-day cookie&lt;/li&gt;&lt;li&gt;JWT guard on owner data endpoints&lt;/li&gt;&lt;li&gt;Registration and login throttles&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;trust-item&quot;&gt;&lt;i data-lucide=&quot;file-lock-2&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Document boundary&lt;/strong&gt;&lt;ul class=&quot;text-small&quot;&gt;&lt;li&gt;Uploads parsed from request memory&lt;/li&gt;&lt;li&gt;No original statement or raw PDF text retained&lt;/li&gt;&lt;li&gt;5 MB bank and 8 MB salary limits&lt;/li&gt;&lt;li&gt;Unknown or unreconciled layouts fail closed&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;trust-item&quot;&gt;&lt;i data-lucide=&quot;vault&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Credential boundary&lt;/strong&gt;&lt;ul class=&quot;text-small&quot;&gt;&lt;li&gt;Document-opening passwords only&lt;/li&gt;&lt;li&gt;AES-256-GCM with dedicated encryption key&lt;/li&gt;&lt;li&gt;Account ID bound as authenticated data&lt;/li&gt;&lt;li&gt;Plaintext and encrypted internals never returned&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;trust-item&quot;&gt;&lt;i data-lucide=&quot;list-checks&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Ledger boundary&lt;/strong&gt;&lt;ul class=&quot;text-small&quot;&gt;&lt;li&gt;Staged review before commit&lt;/li&gt;&lt;li&gt;File hash and row fingerprint dedupe&lt;/li&gt;&lt;li&gt;Atomic commit transaction&lt;/li&gt;&lt;li&gt;Transfer pairs excluded from income and spend&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;/section&gt;

    &lt;section aria-labelledby=&quot;deployment-heading&quot;&gt;
      &lt;div class=&quot;section-heading&quot;&gt;

    (() =&gt; {
      const root = document.getElementById(&#x27;yaft-architecture&#x27;);

      const panels = Array.from(root.querySelectorAll(&#x27;[data-panel]&#x27;));

      tabs.forEach((tab) =&gt; {
        tab.addEventListener(&#x27;click&#x27;, () =&gt; {
          const selected = tab.getAttribute(&#x27;data-view&#x27;);
          tabs.forEach((item) =&gt; {
            const active = item === tab;
            item.setAttribute(&#x27;aria-selected&#x27;, String(active));
            item.classList.toggle(&#x27;btn-primary&#x27;, active);
          });
          panels.forEach((panel) =&gt; {
            panel.hidden = panel.getAttribute(&#x27;data-panel&#x27;) !== selected;
          });
        });
      });

      const flowDetails = [
        {
          title: &#x27;Receive in memory&#x27;,
          copy: &#x27;The API accepts one CSV, XLSX or PDF statement up to 5 MB. The original upload is not written to storage.&#x27;,
          tags: [&#x27;Multer memory&#x27;, &#x27;Owner account check&#x27;]
        },
        {
          title: &#x27;Reject an exact repeat&#x27;,
          copy: &#x27;A SHA-256 hash of the uploaded bytes is checked against active imports for the destination account before parsing begins.&#x27;,
          tags: [&#x27;SHA-256&#x27;, &#x27;Account + file hash&#x27;]
        },
        {
          title: &#x27;Select and parse safely&#x27;,
          copy: &#x27;CSV and XLSX rows use a common normaliser. PDFs must match the selected bank or exactly one registered Axis, PNB or SBI adapter.&#x27;,
          tags: [&#x27;Shared row contract&#x27;, &#x27;Fail-closed registry&#x27;]
        },
        {
          title: &#x27;Reconcile the statement&#x27;,
          copy: &#x27;Bank adapters validate every running balance and the printed debit, credit and closing totals. Any ambiguity rejects the whole document.&#x27;,
          tags: [&#x27;Signed minor units&#x27;, &#x27;No partial rows&#x27;]
        },
        {
          title: &#x27;Create the review batch&#x27;,
          copy: &#x27;Merchant cleanup, deterministic category suggestions and fingerprint checks enrich rows before they become StagedTransaction records.&#x27;,
          tags: [&#x27;ImportBatch: REVIEW&#x27;, &#x27;Duplicate flags&#x27;]
        },
        {
          title: &#x27;Let the owner decide&#x27;,
          copy: &#x27;The review UI exposes dates, descriptions, suggestions, confidence and duplicates. Rows can be excluded or recategorised.&#x27;,
          tags: [&#x27;Human approval&#x27;, &#x27;Editable categories&#x27;]
        },
        {
          title: &#x27;Commit atomically&#x27;,
          copy: &#x27;Included non-duplicates become ledger transactions in one database transaction. Opposite movements across accounts within three days are linked as transfers.&#x27;,
          tags: [&#x27;Unique fingerprint&#x27;, &#x27;Transfer matching&#x27;]
        }
      ];

      const stepButtons = Array.from(root.querySelectorAll(&#x27;[data-step]&#x27;));
      const detailIndex = root.querySelector(&#x27;#flow-detail-index&#x27;);
      const detailTitle = root.querySelector(&#x27;#flow-detail-title&#x27;);
      const detailCopy = root.querySelector(&#x27;#flow-detail-copy&#x27;);
      const detailTags = root.querySelector(&#x27;#flow-detail-tags&#x27;);

      stepButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const index = Number(button.getAttribute(&#x27;data-step&#x27;));
          const detail = flowDetails[index];
          if (!detail || !detailIndex || !detailTitle || !detailCopy || !detailTags) return;
          stepButtons.forEach((item) =&gt; item.setAttribute(&#x27;aria-pressed&#x27;, String(item === button)));
          detailIndex.textContent = String(index + 1);
          detailTitle.textContent = detail.title;
          detailCopy.textContent = detail.copy;
          detailTags.replaceChildren(...detail.tags.map((tag) =&gt; {
            const span = document.createElement(&#x27;span&#x27;);
            span.className = &#x27;viz-badge&#x27;;

            return span;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

&lt;/script&gt;
