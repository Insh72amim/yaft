services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        YAFT_API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-3001}:3000"
    environment:
      PORT: 3000
      YAFT_API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:${DOCKER_API_PORT:-4001}/api
    depends_on:
      - api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - yaft_net

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://yaft:yaft-development-only@host.docker.internal:5432/yaft_finance?schema=public}
      JWT_SECRET: ${JWT_SECRET:-<REDACTED_JWT_SECRET>}
      YAFT_CREDENTIAL_ENCRYPTION_KEY: ${YAFT_CREDENTIAL_ENCRYPTION_KEY:-<REDACTED_ENCRYPTION_KEY>}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      API_PORT: 4000
      NODE_ENV: production
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-yaft-documents}
    ports:
      - "${DOCKER_API_PORT:-4001}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - yaft_net

networks:
  yaft_net:
    driver: bridge
