name: yaft

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        YAFT_API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    ports:
      - "${DOCKER_WEB_PORT:-3001}:3000"
    environment:
      PORT: 3000
      YAFT_API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: http://localhost:${DOCKER_API_PORT:-4001}/api
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yaft}:${POSTGRES_PASSWORD:-yaft-development-only}@postgres:5432/${POSTGRES_DB:-yaft_finance}?schema=public
      JWT_SECRET: ${JWT_SECRET:-<REDACTED_JWT_SECRET>}
      YAFT_CREDENTIAL_ENCRYPTION_KEY: ${YAFT_CREDENTIAL_ENCRYPTION_KEY:-<REDACTED_ENCRYPTION_KEY>}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3001}
      API_PORT: 4000
      NODE_ENV: production
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-yaft-documents}
    ports:
      - "${DOCKER_API_PORT:-4001}:4000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yaft_finance}
      POSTGRES_USER: ${POSTGRES_USER:-yaft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaft-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-yaft} -d ${POSTGRES_DB:-yaft_finance}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio_server
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console Port
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
